name: Release to npm

# Lives at .github/workflows/release.yaml in olsisoft/pulse-js.
# Triggered by tag push (v*). Builds dual ESM+CJS+.d.ts, publishes to npm
# via OIDC Trusted Publishing (no NPM_TOKEN needed — npm 11.5+ auto-
# detects the GitHub Actions OIDC token).
#
# Pre-requisite: configure a Trusted Publisher on npm at
# https://www.npmjs.com/settings/~/trusted-publishers with:
#   - Package: @olsisoft/pulse-client
#   - Publisher: GitHub Actions
#   - Owner: olsisoft / Repo: pulse-js / Workflow: release.yaml / Env: npm
#
# Note: Node 22 ships npm 10.x — we explicitly upgrade to npm latest
# (>= 11.5) before publishing so OIDC works. Provenance attestation is
# automatic on GitHub Actions runs.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for both npm provenance + OIDC trusted publishing
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm   # configure in repo settings → environments
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build dual ESM + CJS + .d.ts
        run: npm run build

      - name: Upgrade npm to >= 11.5 (Trusted Publishing support)
        run: npm install -g npm@latest

      - name: Publish to npm (with OIDC trusted publishing + provenance)
        run: npm publish --access public --provenance
