name: Release to npm

# Lives at .github/workflows/release.yaml in olsisoft/pulse-js.
# Triggered by tag push (v*). Builds dual ESM+CJS+.d.ts, publishes to npm
# with provenance attestation.
#
# Required secret: NPM_TOKEN (npm account → access tokens → granular,
# scope: @olsisoft/pulse-client, permission: publish).
# Provenance is automatic on GitHub Actions runs.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for npm provenance attestation
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm   # configure in repo settings → environments
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ($tag_version) does not match package.json version ($pkg_version)"
            exit 1
          fi

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build dual ESM + CJS + .d.ts
        run: npm run build

      - name: Publish to npm (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
